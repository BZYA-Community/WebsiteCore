Features:
  Default: ["Web", "Frontend:EmbedWeb", "Meili", "LocalOSS", "Postgres", "BigCacheIndex", "LoggerFile"]
BigCacheIndex: # 使用BigCache缓存泡泡广场消息流
  MaxIndexPage: 1024            # 最大缓存页数, 必须是2^n, 代表最大同时缓存多少页数据
  HardMaxCacheSize: 256         # 最大缓存大小(MB), 0表示无限制
WebServer: # Web服务
  HttpIp: 0.0.0.0
  HttpPort: 8008
  ReadTimeout: 60
  WriteTimeout: 60
JWT: # 鉴权加密
  Secret: ""   # 必填! 运行前生成: openssl rand -hex 24 (留空启动会直接报错退出)
  Issuer: paopao-api
  Expire: 86400
Postgres: # PostgreSQL数据库 (与 docker-compose.dev.yml 对齐)
  Host: 127.0.0.1
  Port: 5432
  User: paopao
  Password: paopao
  Dbname: websitecore
  sslmode: disable
Meili: # Meili搜索配置
  Host: 127.0.0.1:7700
  Index: paopao-data
  ApiKey: paopao-meilisearch
  Secure: False
LocalOSS: # 本地文件OSS存储配置
  SavePath: custom/data/oss
  Secure: False
  Bucket: paopao
  Domain: 127.0.0.1:8008
Redis:
  InitAddress:
  - 127.0.0.1:6379
