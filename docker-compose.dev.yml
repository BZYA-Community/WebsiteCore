# Local development dependencies for WebsiteCore.
#
# Only the backing services the app depends on are defined here; the app itself
# runs on the host (make run). Start with `make deps-up`, stop with
# `make deps-down`, wipe data with `make deps-reset`.
#
# Image tags are pinned exactly so environments do not drift; bump them here
# explicitly when upgrading a backing service.

name: websitecore

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: paopao
      POSTGRES_PASSWORD: paopao
      POSTGRES_DB: websitecore
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # postgres:18 stores PGDATA under /var/lib/postgresql/18/docker, so the
      # volume must cover /var/lib/postgresql rather than the old /data path.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  redis:
    image: redis:7.4.11
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  meilisearch:
    image: getmeili/meilisearch:v1.54.0
    environment:
      MEILI_MASTER_KEY: paopao-meilisearch
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "127.0.0.1:7700:7700"
    volumes:
      - meilidata:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  pgdata:
    name: websitecore-pgdata
  redisdata:
    name: websitecore-redisdata
  meilidata:
    name: websitecore-meilidata
