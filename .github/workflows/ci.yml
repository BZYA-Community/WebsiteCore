name: CI

on:
  push:
    branches:
      - main
      - beta
      - dev
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  pull_request:

concurrency:
  group: websitecore-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOPROXY: https://proxy.golang.org

permissions:
  contents: read
  actions: read

jobs:
  backend:
    name: Backend Check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: websitecore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d websitecore_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # go:embed 需要 web/dist 目录存在(干净检出时无构建产物)
      - name: Prepare embed dir
        run: mkdir -p web/dist

      - name: Syntax check (build)
        run: go build ./...

      # 单元测试(干净检出、无 config.yaml 的环境下也必须全绿, 见 #11)
      - name: Unit tests
        run: go test ./...
        env:
          TEST_POSTGRES_DSN: host=127.0.0.1 user=postgres password=postgres dbname=websitecore_test port=5432 sslmode=disable

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0

      - name: Code quality (golangci-lint)
        run: golangci-lint run ./...

  frontend:
    name: Frontend Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: web/yarn.lock

      - name: Setup Yarn
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Code quality (ESLint)
        run: npm run lint

      - name: i18n locale packs (missing/unused/parity)
        run: npm run i18n:check

      - name: Frontend regression tests
        run: |
          yarn test:permissions
          yarn test:media
          yarn test:compose
          yarn test:auth
          yarn test:courses
          yarn test:sidebar
          yarn test:chat
          yarn test:admin
          yarn test:columns
          yarn test:projects
          yarn test:external-link

      - name: Syntax check (build)
        run: npm run build

      - name: Setup Python for browser BVT
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install browser BVT dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Projects production browser BVT (fixture API)
        run: python scripts/project-browser.test.py

      - name: Upload browser BVT failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: projects-browser-bvt
          path: web/browser-test-artifacts/projects/
          if-no-files-found: ignore
          retention-days: 7
