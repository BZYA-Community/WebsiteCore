name: CI

on:
  push:
    branches:
      - main
      - beta
      - dev
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'docs/**'

env:
  GOPROXY: https://proxy.golang.org

permissions:
  contents: read

jobs:
  backend:
    name: Backend Check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: websitecore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d websitecore_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # go:embed 需要 web/dist 目录存在(干净检出时无构建产物)
      - name: Prepare embed dir
        run: mkdir -p web/dist

      - name: Syntax check (build)
        run: go build ./...

      # 单元测试(干净检出、无 config.yaml 的环境下也必须全绿, 见 #11)
      - name: Unit tests
        run: go test ./...

      # 收藏可见性与开关身份需要真实 PostgreSQL 语义，不能在 CI 中静默跳过。
      - name: Collection visibility database BVT
        env:
          TEST_POSTGRES_DSN: host=127.0.0.1 user=postgres password=postgres dbname=websitecore_test port=5432 sslmode=disable
        run: go test ./internal/dao/jinzhu/dbr -run '^TestPostCollectionListUsesCurrentVisibility$' -count=1 -v

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8

      - name: Code quality (golangci-lint)
        run: golangci-lint run ./...

  frontend:
    name: Frontend Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # package-lock.json 未纳入版本管理, 使用 npm install
      - name: Install dependencies
        run: npm install

      - name: Code quality (ESLint)
        run: npm run lint

      - name: i18n locale packs (missing/unused/parity)
        run: npm run i18n:check

      - name: Syntax check (build)
        run: npm run build
