name: Weekly Report

on:
  schedule:
    - cron: '0 12 * * 5'  # UTC 12:00 = 北京时间周五 20:00
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate report
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/weekly-report.sh

      - name: Send to DingTalk
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        run: |
          D=$(date +%Y-%m-%d)
          REPORT=$(cat /tmp/weekly-report.md)
          
          # 转义特殊字符
          REPORT_ESCAPED=$(echo "$REPORT" | sed 's/"/\\"/g' | sed 's/\\/\\\\/g' | tr '\n' ' ' | sed 's/  */ /g')
          
          # 构建钉钉消息（Markdown 格式）
          MSG=$(cat <<EOF
          {
            "msgtype": "markdown",
            "markdown": {
              "title": "社区开发周报 ${D}",
              "text": "## 社区开发周报 ${D}\n\n${REPORT_ESCAPED}\n\n---\n\n[查看详情](https://github.com/BZYA-Community/WebsiteCore)"
            }
          }
          EOF
          )
          
          # 如果配置了加签，计算签名
          if [ -n "$DINGTALK_SECRET" ]; then
            TIMESTAMP=$(date +%s%3N)
            STRING_TO_SIGN="${TIMESTAMP}\n${DINGTALK_SECRET}"
            SIGN=$(echo -ne "$STRING_TO_SIGN" | openssl dgst -sha256 -hmac "$DINGTALK_SECRET" -binary | base64 | sed 's/+/%2B/g' | sed 's/\//%2F/g' | sed 's/=/%3D/g')
            URL="${DINGTALK_WEBHOOK}&timestamp=${TIMESTAMP}&sign=${SIGN}"
          else
            URL="$DINGTALK_WEBHOOK"
          fi
          
          # 发送
          curl -s -X POST "$URL" \
            -H "Content-Type: application/json" \
            -d "$MSG"
          
          echo "周报已推送到钉钉"
