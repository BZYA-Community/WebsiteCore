# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    reviewers:
      - "Alumin-Hydro"
    labels:
      - "enhancement"  # TODO: 创建 dependencies 标签后改为 ["dependencies", "go"]
      - "go"
    commit-message:
      prefix: "mod"
    groups:
      go-minor-patch:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    reviewers:
      - "QQSHI13"
      - "Alumin-Hydro"
    labels:
      - "enhancement"  # TODO: 创建 dependencies 标签后改为 ["dependencies"]
    commit-message:
      prefix: "web"
    versioning-strategy: "increase"
    groups:
      web-minor-patch:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    reviewers:
      - "QQSHI13"
      - "Alumin-Hydro"
    labels:
      - "enhancement"  # TODO: 创建 dependencies 标签后改为 ["dependencies"]
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"